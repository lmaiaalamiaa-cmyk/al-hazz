workflows:
  android-apk:
    name: Al Hazz Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          flutter create --platforms=android --org com.alhazz .
      - name: Set Android app display name
        script: |
          sed -i.bak 's/android:label="al_hazz"/android:label="الحظ"/' android/app/src/main/AndroidManifest.xml || true
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
